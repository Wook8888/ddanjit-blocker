<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #d93025;
    --ok: #1a7f37;
    --chip: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1f22;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --line: #34363a;
      --accent: #f2867c;
      --ok: #6cc17f;
      --chip: #292b2f;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 14px;
    font-family: "Pretendard", "Malgun Gothic", -apple-system, system-ui, sans-serif;
    font-size: 13px;
    color: var(--fg);
    background: var(--bg);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* 토글 스위치 */
  .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: #c4c7cc; border-radius: 22px; transition: .18s;
  }
  .slider:before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .18s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(16px); }

  .row { display: flex; gap: 6px; }
  .rowBetween { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  input[type="text"], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--fg);
    font-family: inherit; font-size: 13px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 58px; }
  button {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--chip); color: var(--fg); font-family: inherit;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.06); }
  button.allow { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.allow:hover { filter: brightness(1.06); }

  .secHead {
    display: flex; align-items: baseline; gap: 6px;
    margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .secHead:first-of-type { border-top: none; padding-top: 0; margin-top: 4px; }
  .secHead b { font-size: 12.5px; }
  .secHead span { font-size: 11px; color: var(--muted); }

  ul { list-style: none; margin: 8px 0 0; padding: 0; overflow-y: auto; }
  #list { max-height: 150px; }
  #allowList { max-height: 110px; }
  li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; background: var(--chip); border-radius: 8px; margin-bottom: 5px;
    word-break: break-all;
  }
  li.allowItem { border-left: 3px solid var(--ok); }
  li .del {
    border: none; background: transparent; color: var(--muted);
    font-size: 15px; padding: 0 4px; line-height: 1;
  }
  li .del:hover { color: var(--accent); }
  .empty {
    color: var(--muted); text-align: center; padding: 14px 0; font-size: 12px;
    background: transparent !important; justify-content: center; border-left: none !important;
  }

  details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; font-weight: 600; font-size: 12.5px; }
  .field { margin-top: 9px; }
  .field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .fieldTitle { font-size: 12.5px; font-weight: 600; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .msg { font-size: 11.5px; margin-top: 6px; min-height: 15px; line-height: 1.4; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--accent); }
  .msg.warn { color: #b26a00; }
  @media (prefers-color-scheme: dark) { .msg.warn { color: #e0a458; } }
  .hidden { display: none !important; }
  .divider { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
  .backupBtn {
    width: 100%; margin-top: 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .backupBtn span { font-size: 11px; color: var(--muted); }
  .syncLine {
    display: block; width: 100%; margin-top: 8px; padding: 6px 4px;
    background: none; border: none; text-align: center;
    font-size: 11px; color: var(--muted); cursor: pointer;
  }
  .syncLine:hover { color: var(--fg); border: none; }
  .syncLine.err { color: #b26a00; }
  @media (prefers-color-scheme: dark) { .syncLine.err { color: #e0a458; } }
  .banner {
    background: #fdeceb; border: 1px solid var(--accent); color: #a5251c;
    border-radius: 8px; padding: 8px 10px; font-size: 11.5px; margin-bottom: 10px;
    line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    .banner { background: #3a2624; color: #f2a29a; }
  }
  .banner.warnBanner {
    background: #fff8e6; border-color: #d99100; color: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    .banner.warnBanner { background: #33290f; border-color: #a8760f; color: #e6bb6a; }
  }
  .banner button { padding: 6px 10px; font-size: 12px; }

  .rowRight { display: flex; align-items: center; gap: 5px; flex: none; }
  button.chip {
    padding: 3px 8px; font-size: 11px; border-radius: 999px;
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  button.chip:hover { filter: brightness(1.08); }

  /* 잠금 화면 — 단어 문제 */
  #lock { text-align: center; padding: 14px 2px 4px; }
  #lock .lockIcon { font-size: 26px; }
  #lock .lockHint { color: var(--muted); font-size: 11.5px; margin: 6px 0 16px; line-height: 1.5; }
  .qWord { font-size: 19px; font-weight: 700; letter-spacing: -.3px; word-break: keep-all; }
  .qIpa {
    font-size: 14px; margin-top: 5px;
    font-family: "Gentium Plus", "Charis SIL", "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
  }
  .qRead { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .qOpts { display: grid; gap: 6px; margin-top: 15px; text-align: left; }
  .qOpts button {
    width: 100%; white-space: normal; line-height: 1.45;
    padding: 9px 11px; font-size: 12.5px;
  }
  .qOpts button.right { border-color: var(--ok); color: var(--ok); }
  .qOpts button.wrong { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<!-- 잠금 화면 -->
<section id="lock" class="hidden">
  <div class="lockIcon">🔒</div>
  <div class="lockHint">잠겨 있습니다.<br>뜻을 맞히면 5분 동안 열립니다.</div>
  <div class="qWord" id="qWord"></div>
  <div class="qIpa" id="qIpa"></div>
  <div class="qRead" id="qRead"></div>
  <div class="qOpts" id="qOpts"></div>
  <div class="msg" id="lockMsg"></div>
</section>

<!-- 메인 화면 -->
<section id="main" class="hidden">
  <div id="errorBanner" class="banner hidden"></div>
  <div id="permBanner" class="banner warnBanner hidden"></div>
  <header>
    <div>
      <h1>딴짓 차단기</h1>
      <div class="sub" id="statusText">차단 작동 중</div>
    </div>
    <label class="switch" title="차단 켜기/끄기">
      <input type="checkbox" id="enabledToggle" />
      <span class="slider"></span>
    </label>
  </header>

  <div class="secHead">
    <b>차단 목록</b><span>서브도메인 포함</span>
  </div>
  <div class="row">
    <input type="text" id="domainInput" placeholder="예: naver.com" autocomplete="off" />
    <button class="primary" id="addBtn">차단</button>
  </div>
  <div class="msg" id="addMsg"></div>
  <ul id="list"></ul>

  <div class="secHead">
    <b>예외 목록</b><span>차단보다 우선 허용</span>
  </div>
  <div class="row">
    <input type="text" id="allowInput" placeholder="예: map.naver.com" autocomplete="off" />
    <button class="allow" id="allowAddBtn">허용</button>
  </div>
  <div class="msg" id="allowMsg"></div>
  <ul id="allowList"></ul>

  <details id="settings">
    <summary>설정</summary>

    <div class="field rowBetween">
      <div>
        <div class="fieldTitle">잠금</div>
        <div class="hint" style="margin-top:2px">팝업을 열 때 단어 문제를 냅니다</div>
      </div>
      <label class="switch" title="잠금 켜기/끄기">
        <input type="checkbox" id="lockToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint">
      한 번 맞히면 5분 동안 열려 있습니다. 문제로 나올 단어는
      <b>백업 · 불러오기</b>의 엑셀 '단어' 시트에서 직접 고칠 수 있습니다.
    </div>
    <div class="msg" id="lockSetMsg"></div>

    <div class="field divider">
      <label for="devName">기기 이름 · 동기화 기록에 표시됩니다</label>
      <div class="row">
        <input type="text" id="devName" placeholder="예: 회사 PC" maxlength="24" autocomplete="off" />
        <button id="saveDevBtn">저장</button>
      </div>
    </div>
    <div class="msg" id="devMsg"></div>
  </details>

  <button id="backupBtn" class="backupBtn">백업 · 불러오기 <span>엑셀 파일</span></button>
  <button class="syncLine" id="syncLine"></button>
</section>

<script src="common.js"></script>
<script src="words.js"></script>
<script src="popup.js"></script>
</body>
</html>
