<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>접속이 차단되었습니다</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1f2328; --muted: #6b7280;
    --card: #ffffff; --line: #e5e7eb; --accent: #d93025; --ok: #1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --fg: #e8eaed; --muted: #9aa0a6; --card: #1f2124;
            --line: #34363a; --accent: #f2867c; --ok: #6cc17f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: "Pretendard", "Malgun Gothic", -apple-system, system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 44px 40px; max-width: 560px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.06);
  }
  /* 이모지 글꼴을 먼저 지정 — 윈도우에서 네모(□)로 깨지는 문제 방지.
     기본값은 이모지가 아니라 도형 '□' 이므로 일반 글꼴도 함께 넣어둔다. */
  .emoji {
    font-size: 52px; line-height: 1; color: var(--muted);
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji",
                 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  h1 { font-size: 24px; margin: 18px 0 12px; font-weight: 700; }
  p.message { color: var(--muted); font-size: 15px; line-height: 1.7; white-space: pre-wrap; margin: 0; }

  /* 차단된 주소 */
  .urlbox {
    margin-top: 26px; text-align: left;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 12px 12px 14px;
  }
  .urlbox .label { font-size: 11.5px; color: var(--muted); margin-bottom: 7px; }
  .urlrow { display: flex; align-items: flex-start; gap: 10px; }
  .url {
    flex: 1; min-width: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.55;
    color: var(--fg); word-break: break-all;
    max-height: 7.8em; overflow-y: auto;
    user-select: text; cursor: text; /* 원하는 부분만 골라 복사할 수 있게 (클릭 한 번에 전체 선택하지 않음) */
  }
  .rule { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .rule code { font-family: ui-monospace, Menlo, Consolas, monospace; }

  /* 단어 문제 (잠금을 켠 사람에게만). 맞혀도 사이트는 열리지 않는다 */
  .quiz { margin-top: 26px; padding-top: 22px; border-top: 1px dashed var(--line); }
  .quiz .qLabel { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .qWord { font-size: 22px; font-weight: 700; letter-spacing: -.3px; word-break: keep-all; }
  .qIpa { font-size: 15px; margin-top: 5px;
    font-family: "Gentium Plus", "Charis SIL", "DejaVu Sans", "Segoe UI", system-ui, sans-serif; }
  .qRead { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .qOpts { display: grid; gap: 7px; margin-top: 16px; text-align: left; }
  .qOpts button {
    width: 100%; white-space: normal; line-height: 1.45; padding: 10px 13px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); cursor: pointer;
  }
  .qOpts button:hover:not(:disabled) { border-color: var(--muted); }
  .qOpts button:disabled { cursor: default; }
  .qOpts button.right { border-color: var(--ok); color: var(--ok); }
  .qOpts button.wrong { border-color: var(--accent); color: var(--accent); }
  .qMsg { min-height: 20px; margin-top: 10px; font-size: 13px; }
  .qMsg.ok { color: var(--ok); } .qMsg.err { color: var(--accent); }

  .foot { margin-top: 26px; font-size: 12px; color: var(--muted); }
  .foot b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji" id="emoji">□</div>
    <h1 id="title">잠깐</h1>
    <p class="message" id="message">지금 해야 할 일로 돌아가 볼까요?</p>

    <div class="quiz" id="quiz" hidden>
      <div class="qLabel">사이트는 열리지 않아도, 단어 하나는 남아요</div>
      <div class="qWord" id="qWord"></div>
      <div class="qIpa" id="qIpa"></div>
      <div class="qRead" id="qRead"></div>
      <div class="qOpts" id="qOpts"></div>
      <div class="qMsg" id="qMsg"></div>
    </div>

    <div class="urlbox" id="urlbox" hidden>
      <div class="label">차단된 주소</div>
      <div class="urlrow">
        <div class="url" id="url"></div>
      </div>
      <div class="rule" id="rule" hidden>차단 규칙: <code id="ruleDomain"></code></div>
    </div>

    <div class="foot"><b>딴짓 차단기</b>가 이 페이지를 막았습니다.</div>
    <div class="foot" style="margin-top:10px; opacity:.75;">
      예외로 허용해둔 주소인데 이 화면이 보인다면, 이 페이지를 새로고침하지 말고<br>
      주소창에 주소를 다시 입력해 보세요.
    </div>
  </div>
  <script src="common.js"></script>
  <script src="words.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
