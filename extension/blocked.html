<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>접속이 차단되었습니다</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1f2328; --muted: #6b7280;
    --card: #ffffff; --line: #e5e7eb; --accent: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --fg: #e8eaed; --muted: #9aa0a6; --card: #1f2124; --line: #34363a; --accent: #f2867c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: "Pretendard", "Malgun Gothic", -apple-system, system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 44px 40px; max-width: 520px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.06);
  }
  .emoji { font-size: 56px; line-height: 1; }
  h1 { font-size: 24px; margin: 18px 0 12px; font-weight: 700; }
  p.message { color: var(--muted); font-size: 15px; line-height: 1.7; white-space: pre-wrap; margin: 0; }
  .domain {
    display: inline-block; margin-top: 22px; padding: 7px 14px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    font-size: 13px; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all;
  }
  .foot { margin-top: 26px; font-size: 12px; color: var(--muted); }
  .foot b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji" id="emoji">🛑</div>
    <h1 id="title">잠깐! 지금은 접속할 수 없어요</h1>
    <p class="message" id="message"></p>
    <div class="domain" id="domain"></div>
    <div class="foot"><b>딴짓 차단기</b>가 이 페이지를 막았습니다.</div>
    <div class="foot" style="margin-top:10px; opacity:.75;">
      예외로 허용해둔 주소인데 이 화면이 보인다면, 이 페이지를 새로고침하지 말고<br>
      주소창에 주소를 다시 입력해 보세요.
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
